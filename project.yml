name: PocketAI
options:
  bundleIdPrefix: com.getpocketai
packages:
  PocketCore:
    path: ../PocketAI.Core
targets:
  PocketAI:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Sources]
    scheme:
      storeKitConfiguration: PocketAI.storekit
      testTargets:
        - PocketAIUITests
    resources:
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: ShareExtension
        embed: true
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketMLX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/PocketAI.entitlements
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "PocketAI finds and connects to your Mac on this network."
        NSBonjourServices:
          - _pocketai._tcp
        NSCameraUsageDescription: "Scan your Mac's pairing code and take photos for vision models."
        NSMicrophoneUsageDescription: "PocketAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "PocketAI transcribes your voice on-device for voice input."
        NSPhotoLibraryUsageDescription: "PocketAI attaches photos you choose to your chat."
        NSPhotoLibraryAddUsageDescription: "PocketAI saves generated images to your photo library."
        CFBundleURLTypes:
          - CFBundleURLName: app.getpocketai.pocketai
            CFBundleURLSchemes:
              - pocketai

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ShareExtension
      - path: Sources/SharedInbox/SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.ShareExtension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements/ShareExtension.entitlements
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to PocketAI
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1

  PocketAIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests]
    dependencies:
      - target: PocketAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: PocketAI


