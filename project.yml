name: PocketAI
options:
  bundleIdPrefix: com.getpocketai
  developmentLanguage: en
  # Locales the app ships. Translations live in
  # Resources/Localizable.xcstrings; shared components come localized from
  # PocketUI's own catalog.
  knownRegions: [en, hi, es, fr, de, ja, zh-Hans, pt-BR, Base]
packages:
  PocketCore:
    path: ../PocketAI.Core
targets:
  PocketAI:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    scheme:
      testTargets:
        - PocketAIUITests
        - PocketAITests
    sources:
      - Sources
      - path: Resources/PrivacyInfo.xcprivacy
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: PocketCore
        product: PocketKit
      - package: PocketCore
        product: PocketUI
      - package: PocketCore
        product: PocketImageGen
      - package: PocketCore
        product: PocketMLX
      # Imported by AppModel, SettingsView, HomeView, ProjectDetailView and
      # ChatsListView. It was missing here and the build only survived on a
      # stale .xcodeproj that still carried it; regenerating dropped it.
      - package: PocketCore
        product: PocketLiveShortly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: 4RK6YA795V
        CODE_SIGN_ENTITLEMENTS: Entitlements/PocketAI-dev.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleLocalizations: [en, hi, es, fr, de, ja, zh-Hans, pt-BR]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "46"
        # Standard/exempt crypto only (TLS, Ed25519, tokens) — auto-clears the
        # TestFlight Export Compliance prompt (incl. France) so no manual step.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "PocketAI finds and connects to your Mac on this network."
        NSBonjourServices:
          - _pocketai._tcp
        # NET-22: chat-sync catch-up with the paired Mac.
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [app.getpocketai.chatsync]
        NSCameraUsageDescription: "Scan your Mac's pairing code and take photos for vision models."
        NSMicrophoneUsageDescription: "PocketAI uses the microphone for voice input."
        NSSpeechRecognitionUsageDescription: "PocketAI transcribes your voice on-device for voice input."
        NSPhotoLibraryUsageDescription: "PocketAI attaches photos you choose to your chat."
        NSPhotoLibraryAddUsageDescription: "PocketAI saves generated images to your photo library."
        CFBundleURLTypes:
          - CFBundleURLName: app.getpocketai.pocketai
            CFBundleURLSchemes:
              - pocketai

  # The five suites under UITests/ were written but no target ever referenced
  # them, so none had been built, let alone run. Mirrors the Mac's
  # PocketAIUITests target.
  PocketAIUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [UITests]
    dependencies:
      - target: PocketAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.uitests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: 4RK6YA795V
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PocketAI

  # UI-144: logic tests for the app target (the UI suites cannot reach pure functions).
  PocketAITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [Tests]
    dependencies:
      - target: PocketAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getpocketai.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PocketAI.app/PocketAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
