name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Persistent cargo target dir so the cloned Core's llama.cpp/Rust build is
# cached across runs instead of rebuilt each time.
env:
  CARGO_TARGET_DIR: /Users/rohit/.cache/pocket-ci/iphone

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: PocketAI.Iphone
      # Self-hosted runner on the dev Mac: clone PocketAI.Core from the local
      # working copy (current with pushed main) as a sibling, so the SPM path
      # dependency (../PocketAI.Core) resolves with no cross-repo token and no
      # keychain/network access (sidesteps the old CORE_REPO_TOKEN gate, D70).
      - name: Clone PocketAI.Core (local)
        run: |
          rm -rf PocketAI.Core
          git clone --depth 1 /Users/rohit/rsehgal/github/getpocketai/PocketAI.Core PocketAI.Core
      - run: bash scripts/build-xcframework.sh
        working-directory: PocketAI.Core
      - run: xcodegen generate
        working-directory: PocketAI.Iphone
      # Device-target build (unsigned; project sets CODE_SIGNING_ALLOWED=NO).
      # No Simulator run: a headless launchd runner can't drive the Simulator
      # GUI. Simulator/unit tests need the runner in a logged-in GUI session.
      - run: xcodebuild -scheme PocketAI -destination 'generic/platform=iOS' build
        working-directory: PocketAI.Iphone
